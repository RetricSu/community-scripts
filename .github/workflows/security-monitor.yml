name: CKB Contract Security Monitor

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_BEARER_TOKEN: ${{ secrets.ALERT_WEBHOOK_BEARER_TOKEN }}
      CKB_MAINNET_RPC_URL: ${{ vars.CKB_MAINNET_RPC_URL }}
      CKB_TESTNET_RPC_URL: ${{ vars.CKB_TESTNET_RPC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: results/monitor-state.json
          key: ckb-monitor-state-${{ github.run_id }}
          restore-keys: ckb-monitor-state-

      # Do not stop the job before artifacts / upgrade PR steps on a finding.
      - name: Run all-source monitor
        id: monitor
        continue-on-error: true
        run: pnpm run monitor -- --network both --fail-on P0

      - name: Apply whitelisted upgrades (working tree only)
        continue-on-error: true
        run: pnpm run monitor:upgrade -- --network both --apply --no-notify --fail-on none

      - name: Create baseline update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/ckb-deployment-upgrades
          delete-branch: true
          title: 'chore: sync whitelisted CKB contract deployments'
          body: |
            Generated by the CKB contract security monitor after a whitelisted on-chain upgrade.
            Please review the upgrade transaction, new data hash and all external source records before merging.
          labels: ckb-monitor,deployment-sync
          add-paths: src/deployments/*.json
          commit-message: 'chore: sync whitelisted CKB contract deployments'

      - name: Upload monitor reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckb-security-monitor-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Surface P0 result
        if: steps.monitor.outcome == 'failure'
        run: echo 'P0 finding detected; inspect the uploaded monitor report.' && exit 1
