name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm exec biome lint src

      - name: Test
        run: pnpm test

      # Vendored gp generator (flow/): build all spec pages, run its unit
      # tests, then validate HTML/meta/agent outputs (scripts/check.js).
      - name: Validate flow specs
        run: |
          node flow/gen.js --all out
          node --test flow/tests/*.test.js
          node flow/scripts/check.js

      # Overlap contracts (baseline-owned): flow meta mechanical facts must
      # match the security baseline. Read-only, never writes.
      - name: Check baseline -> flow projection drift
        run: node scripts/gen-flow-meta.js --all --check
