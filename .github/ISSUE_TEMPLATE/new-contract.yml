name: Add a new contract
description: Request or contribute a new CKB contract page
title: "[Contract] <name>"
labels: ["new-contract"]
body:
  - type: markdown
    attributes:
      value: |
        ## How to add a new contract

        **Option 1: with an AI agent (recommended)**
        1. Send this to an agent that can read code and run commands (Cursor / Claude Code / Codex, etc.):
           > Read https://raw.githubusercontent.com/RetricSu/community-scripts/master/flow/skills/ckb-contract-flow/SKILL.md and follow its steps to generate the contract cell-flow HTML for <contract repo URL or local path>
        2. The agent generates `flow/contracts/<id>/{spec.json, plugin.js, tests.json, meta.json}`.
        3. The agent runs and must pass all checks:
           ```bash
           node flow/gen.js --all out
           node flow/scripts/check.js
           node flow/scripts/test-tx.js <id>
           ```
        4. After reviewing, have the agent open a PR (branch `contract/<id>`, tick every item in the PR template checklist). To get attribution, add your GitHub username to `contributors` in `meta.json` (optional).

        **Option 2: manually**
        `node flow/scripts/new-contract.js <id> --kind lock|type` generates the skeleton; fill it in following [flow/docs/ADD_CONTRACT.md](https://github.com/RetricSu/community-scripts/blob/master/flow/docs/ADD_CONTRACT.md).

        **Just requesting?** Fill in the fields below — a maintainer or agent will follow up.
  - type: input
    id: repo
    attributes:
      label: Source repo
      description: Repo URL, ideally pinned to a commit
      placeholder: https://github.com/owner/repo/tree/<commit>
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Script kind
      options: [lock, type, unsure]
    validations:
      required: true
  - type: textarea
    id: deployments
    attributes:
      label: Deployments
      description: Mainnet / testnet code_hash, hash_type, cell_dep (with the official docs or SDK constant source)
      placeholder: |
        mainnet: code_hash=0x... hash_type=type  source: ...
        testnet: code_hash=0x... hash_type=type  source: ...
  - type: input
    id: example_tx
    attributes:
      label: Example tx hash
      description: At least one real on-chain tx using this contract (optional)
  - type: input
    id: tags
    attributes:
      label: Tags
      description: See flow/contracts/tags.json, e.g. token / nft / defi / identity / channel / btc / proxy / quantum
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'll open a PR myself (or with an agent)
